name: Build TLA APK

on:
  workflow_dispatch:
  push:

jobs
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract TLA project
        run: |
          unzip -o "TLA (1).zip" -d extracted
          echo "Contents:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Android APK
        run: |
          cd extracted/TLA
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TLA-APK
          path: extracted/TLA/app/build/outputs/apk/debug/*.apk
